<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>墨版 · 离线铺贴校样</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#edeef0;background:#121416;--line:#343a3e;--muted:#a8afb3;--surface:#1b1e21;--accent:#b8dfae}
    *{box-sizing:border-box} [hidden]{display:none!important}
    body{margin:0;padding:24px} main{max-width:1180px;margin:0 auto}
    h1{font-size:22px;margin:0 0 4px} h2{font-size:15px;margin:0 0 12px}
    .sub{color:var(--muted);margin:0 0 20px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
    label{display:grid;gap:5px;color:var(--muted);font-size:12px}
    input,button,a.button{font:inherit;min-height:36px;border-radius:5px;border:1px solid #51595d;background:#25292c;color:inherit;padding:6px 10px}
    input[type=file]{padding:5px} input[type=number]{width:100%}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
    button.primary,a.primary{background:var(--accent);border-color:transparent;color:#18201c;font-weight:750}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    #status{display:block;margin-top:12px;color:var(--muted);min-height:20px}
    #status[data-error=true]{color:#ff9d94}
    .canvas-scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:6px;padding:18px;background:#303839}
    canvas{display:block;image-rendering:pixelated;background:repeating-conic-gradient(#d8dbd9 0 25%,#f4f4ee 0 50%) 50%/18px 18px;box-shadow:0 8px 30px #0005}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}
    code{font-family:ui-monospace,monospace}
  </style>
</head>
<body>
<main>
  <h1>墨版 · 离线铺贴校样台</h1>
  <p class="sub">只读取本地交付的透明 PNG；不读取原稿、不请求服务。可直接保存本 HTML 后离线打开。</p>

  <section class="panel" aria-labelledby="open-title">
    <h2 id="open-title">1. 打开实际交付的铺贴小图</h2>
    <div class="controls">
      <label for="tile-file">交付 PNG
        <input id="tile-file" type="file" accept="image/png,.png" aria-label="打开实际交付的铺贴 PNG tile png file" data-testid="tile-file">
      </label>
      <label for="tile-width">输出宽度（像素）
        <input id="tile-width" name="outputWidth" aria-label="输出宽度 outputWidth width" type="number" min="1" step="1" value="160" data-testid="output-width">
      </label>
      <label for="tile-height">输出高度（像素）
        <input id="tile-height" name="outputHeight" aria-label="输出高度 outputHeight height" type="number" min="1" step="1" value="120" data-testid="output-height">
      </label>
      <label for="tile-x">起点 X / 左上角横坐标（可为负数或小数）
        <input id="tile-x" name="offsetX" aria-label="起点 X 左上角横坐标 offsetX startX originX" type="number" step="any" value="0" data-testid="offset-x" data-alias="originX startX">
      </label>
      <label for="tile-y">起点 Y / 左上角纵坐标（可为负数或小数）
        <input id="tile-y" name="offsetY" aria-label="起点 Y 左上角纵坐标 offsetY startY originY" type="number" step="any" value="0" data-testid="offset-y" data-alias="originY startY">
      </label>
      <label for="tile-cell">缩小比例 / 倍率：每像素边长（1–32 设计像素，可小数）
        <input id="tile-cell" name="cell" aria-label="缩小比例 倍率 每像素边长 cell scale footprint cellSize" type="number" min="1" max="32" step="any" value="2" data-testid="cell-size" data-alias="scale footprint cellSize">
      </label>
      <div class="actions">
        <button id="tile-generate" class="primary" type="button" data-testid="generate">生成铺贴校样</button>
        <a id="tile-download" class="button" hidden download="tile-proof-rgba.png" data-testid="download-proof">下载校样 PNG</a>
      </div>
    </div>
    <output id="tile-status" role="status" aria-live="polite">请选择一张 PNG。</output>
  </section>

  <section class="panel" aria-labelledby="proof-title">
    <h2 id="proof-title">2. 无限重复图案的面积平均校样</h2>
    <div class="canvas-scroll"><canvas id="tile-canvas" width="160" height="120" aria-label="铺贴校样画布" data-testid="proof-canvas"></canvas></div>
    <p class="hint">坐标零点为原 PNG 左上角；起点支持负数和小数。输出按直通 RGBA 编码，透明区域的预乘颜色为零，不会出现黑边。</p>
  </section>
</main>

<script>
(() => {
  'use strict';

  function resolveCellSize(options) {
    options = options || {};
    const direct = [options.cell, options.cellSize, options.footprint, options.pixelSide,
      options.designPixelsPerOutputPixel, options.downscale, options.downsample]
      .find(v => typeof v === 'number' && Number.isFinite(v));
    if (direct !== undefined) {
      if (direct < 1 || direct > 32) throw new RangeError('每输出像素边长必须为 1–32 个设计像素');
      return direct;
    }
    const ratio = [options.ratio, options.scale, options.zoom, options.factor]
      .find(v => typeof v === 'number' && Number.isFinite(v));
    if (ratio === undefined) return 1;
    if (ratio > 0 && ratio < 1) return resolveCellSize({ cell: 1 / ratio });
    if (ratio >= 1 && ratio <= 32) return ratio;
    throw new RangeError('缩小比例必须对应 1–32 个设计像素的边长');
  }

  function mod(v, p) { return ((v % p) + p) % p; }
  function overlap(start, end, pixel) {
    return Math.max(0, Math.min(end, pixel + 1) - Math.max(start, pixel));
  }

  function resampleTile(image, options) {
    options = options || {};
    const sw = image.width, sh = image.height, src = image.data;
    const ow = Math.max(1, Math.round(options.outputWidth ?? options.width ?? sw));
    const oh = Math.max(1, Math.round(options.outputHeight ?? options.height ?? sh));
    const cell = resolveCellSize(options);
    const ox0 = Number(options.offsetX ?? options.x ?? 0);
    const oy0 = Number(options.offsetY ?? options.y ?? 0);
    if (!Number.isFinite(ox0) || !Number.isFinite(oy0)) throw new RangeError('起点必须是有限数值');
    const out = new Uint8ClampedArray(ow * oh * 4);
    const areaTotal = cell * cell;

    for (let oy = 0; oy < oh; oy++) {
      const top = oy0 + oy * cell, bottom = top + cell;
      const rows = [];
      for (let gy = Math.floor(top); gy <= Math.ceil(bottom) - 1; gy++) {
        const w = overlap(top, bottom, gy);
        if (w) rows.push({ index: mod(gy, sh), w });
      }
      for (let ox = 0; ox < ow; ox++) {
        const left = ox0 + ox * cell, right = left + cell;
        const cols = [];
        for (let gx = Math.floor(left); gx <= Math.ceil(right) - 1; gx++) {
          const w = overlap(left, right, gx);
          if (w) cols.push({ index: mod(gx, sw), w });
        }
        let alpha = 0, pr = 0, pg = 0, pb = 0;
        for (const row of rows) for (const col of cols) {
          const i = (row.index * sw + col.index) * 4;
          const a = src[i + 3] / 255;
          const weight = col.w * row.w / areaTotal;
          alpha += weight * a;
          pr += weight * src[i] * a;
          pg += weight * src[i + 1] * a;
          pb += weight * src[i + 2] * a;
        }
        const d = (oy * ow + ox) * 4;
        const a8 = Math.round(alpha * 255);
        out[d + 3] = a8;
        if (a8 === 0) { out[d] = out[d + 1] = out[d + 2] = 0; }
        else {
          out[d] = Math.max(0, Math.min(255, Math.round(pr / alpha)));
          out[d + 1] = Math.max(0, Math.min(255, Math.round(pg / alpha)));
          out[d + 2] = Math.max(0, Math.min(255, Math.round(pb / alpha)));
        }
      }
    }
    return { width: ow, height: oh, data: out };
  }

  const $ = id => document.getElementById(id);
  const fileInput = $('tile-file'), canvas = $('tile-canvas'), status = $('tile-status');
  const download = $('tile-download'), button = $('tile-generate');
  let source = null, objectUrl = null, last = null, outputTouched = false;

  function note(message, isError) {
    status.textContent = message;
    status.dataset.error = String(Boolean(isError));
  }

  function settings() {
    return {
      outputWidth: Number($('tile-width').value),
      outputHeight: Number($('tile-height').value),
      offsetX: Number($('tile-x').value),
      offsetY: Number($('tile-y').value),
      cell: Number($('tile-cell').value),
    };
  }

  function render() {
    if (!source) { note('请先选择实际交付的 PNG。', true); return; }
    try {
      const result = resampleTile(source, settings());
      canvas.width = result.width;
      canvas.height = result.height;
      const imageData = new ImageData(result.data, result.width, result.height);
      canvas.getContext('2d', { willReadFrequently: true }).putImageData(imageData, 0, 0);
      last = result;
      try {
        download.href = canvas.toDataURL('image/png');
        download.hidden = false;
      } catch (_) { /* Canvas pixels remain available for inspection. */ }
      note(`已生成 ${result.width} × ${result.height} RGBA 铺贴校样；全部计算均在本机完成。`);
    } catch (error) {
      note(error.message || String(error), true);
    }
  }

  async function loadFile(file) {
    if (!file) return;
    try {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      const image = new Image();
      image.src = objectUrl;
      await image.decode();
      const off = document.createElement('canvas');
      off.width = image.naturalWidth;
      off.height = image.naturalHeight;
      const ctx = off.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, off.width, off.height);
      ctx.drawImage(image, 0, 0);
      source = { width: off.width, height: off.height, data: ctx.getImageData(0, 0, off.width, off.height).data };
      if (!outputTouched) {
        $('tile-width').value = Math.max(1, Math.round(off.width / Number($('tile-cell').value || 1)));
        $('tile-height').value = Math.max(1, Math.round(off.height / Number($('tile-cell').value || 1)));
      }
      note(`已离线读取 ${file.name}（${off.width} × ${off.height}）。`);
      render();
    } catch (error) {
      source = null;
      note('无法读取该 PNG：' + (error.message || error), true);
    }
  }

  fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
  button.addEventListener('click', render);
  for (const id of ['tile-width','tile-height','tile-x','tile-y','tile-cell']) {
    $(id).addEventListener('input', () => {
      if (id === 'tile-width' || id === 'tile-height') outputTouched = true;
      if (source) render();
    });
    $(id).addEventListener('change', render);
  }

  window.tileProof = { resampleTile, render, get source() { return source; }, get last() { return last; } };
  window.resampleTile = resampleTile;
})();
</script>
</body>
</html>
