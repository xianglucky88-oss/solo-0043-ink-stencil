<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>墨版 · 矢量遮罩合成校样</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/layout.css">
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>墨版</h1><span class="tag">矢量遮罩合成校样</span></div>
    <div class="tools">
      <button id="demo" type="button">样例</button>
      <button id="import" type="button" title="导入工作文档">导入 JSON</button><input id="file" type="file" accept=".json,application/json" hidden>
      <button id="render" type="button">更新校样</button>
      <button id="freeze" class="accent" type="button">冻结版本</button>
    </div>
  </header>
  <main>
    <div class="record">
      <div><span class="eyebrow">工作文档</span><h2 id="document-name">载入中</h2></div>
      <output id="status" role="status" aria-live="polite">读取本地样例…</output>
    </div>
    <div class="workspace">
      <section class="stage" aria-labelledby="stage-title">
        <div class="panel-head"><h3 id="stage-title">校样</h3><span class="asset-links"><a id="download" hidden download>下载冻结 PNG</a><a id="mark-download" hidden download>导出徽记素材</a></span></div>
        <div id="stage"></div>
      </section>
      <aside class="inspector" aria-label="编辑与检查">
        <div class="panel-head"><h3>参数</h3></div>
        <div id="controls"></div>
        <div id="inspection"></div>
        <section class="details" aria-labelledby="composite-title">
          <h4 id="composite-title">本地换底合成</h4>
          <p class="muted">底图在本机传入并合成，不连接墨版服务。需与冻结画布同尺寸的 8 位 RGBA PNG；尺寸不符不出图。</p>
          <div class="composite-row">
            <label class="file-button">选择徽记素材 (.inkmark)
              <input id="mark-file" type="file" accept=".inkmark,application/x-ink-mark" hidden>
            </label>
            <span id="mark-source" class="mono muted">使用当前冻结稿素材</span>
          </div>
          <div class="composite-row">
            <label class="file-button">选择底图 PNG
              <input id="backdrop-file" type="file" accept=".png,image/png" hidden>
            </label>
          </div>
          <output id="composite-status" class="mono muted" role="status" aria-live="polite">等待底图</output>
          <div id="composite-result"></div>
          <a id="composite-download" class="file-button" hidden download="inkmark-composite.png">下载合成 PNG</a>
        </section>
        <details class="details"><summary>源文档</summary><div id="editor-extras"></div><textarea id="document" aria-label="JSON 工作文档" wrap="off" spellcheck="false"></textarea></details>
        <details class="details" open><summary>冻结版本</summary><div id="versions"></div></details>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
